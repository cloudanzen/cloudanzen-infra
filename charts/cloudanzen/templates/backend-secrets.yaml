{{- if .Values.backend.secretEnv }}
# Application secrets from the environment's Secret Manager project (ADR-0003).
# Values never pass through Git, Helm or Argo; ESO writes the Secret directly.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "cloudanzen.name" . }}-backend-secrets
  labels:
    {{- include "cloudanzen.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secretStore }}
    kind: SecretStore
  target:
    name: {{ include "cloudanzen.name" . }}-backend-secrets
    creationPolicy: Owner
  data:
    {{- range $envName, $secretId := .Values.backend.secretEnv }}
    - secretKey: {{ $envName }}
      remoteRef:
        key: {{ $secretId }}
    {{- end }}
{{- end }}
