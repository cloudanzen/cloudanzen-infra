{{- $api := .Values.urls.api -}}
{{- $chartEnv := dict
  "NODE_ENV" "production"
  "APP_ENV" .Values.environment
  "HOST" "0.0.0.0"
  "PORT" "3000"
  "LOG_LEVEL" "info"
  "SENTRY_ENVIRONMENT" .Values.environment
  "FRONTEND_URL" .Values.urls.frontend
  "PLATFORM_FRONTEND_URL" .Values.urls.platform
  "BACKEND_URL" $api
  "CORS_ORIGIN" (printf "%s,%s" .Values.urls.frontend .Values.urls.platform)
  "GOOGLE_CALLBACK_URL" (printf "%s/auth/google/callback" $api)
  "GITHUB_CALLBACK_URL" (printf "%s/api/integrations/github/callback" $api)
  "GOOGLE_DRIVE_CALLBACK_URL" (printf "%s/api/integrations/google/callback" $api)
  "SLACK_REDIRECT_URI" (printf "%s/api/integrations/slack/callback" $api)
  "INTERCOM_REDIRECT_URI" (printf "%s/api/integrations/intercom/callback" $api)
  "SALESFORCE_REDIRECT_URI" (printf "%s/api/integrations/salesforce/callback" $api)
-}}
{{- /* Behind the Gateway the backend must know which peers are proxies, or
     every client shares the load balancer's address (backend
     src/config/trust-proxy.ts; required by its deployment guard). */ -}}
{{- if .Values.gateway.enabled }}
{{- $_ := set $chartEnv "TRUST_PROXY_CIDRS" (join "," .Values.gateway.trustedProxies) }}
{{- end }}
{{- $env := merge (deepCopy .Values.backend.env) $chartEnv -}}
# Non-secret backend configuration. Every public URL and OAuth callback is set
# explicitly from the environment's hosts, so no production default from the
# backend schema can apply (backend src/config/deployment-guard.ts).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloudanzen.name" . }}-backend-env
  labels:
    {{- include "cloudanzen.labels" . | nindent 4 }}
data:
  {{- range $k, $v := $env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
