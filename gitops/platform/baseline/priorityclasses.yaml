# Production outranks staging on the shared cluster (ADR-0006): under
# resource pressure staging pods are preempted first.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: cloudanzen-prod
value: 100000
globalDefault: false
description: CloudAnzen production workloads
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: cloudanzen-staging
value: 1000
globalDefault: false
preemptionPolicy: Never
description: CloudAnzen staging workloads; never preempts others
