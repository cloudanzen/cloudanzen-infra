# Secrets come from GCP Secret Manager in cloudanzen-staging (ADR-0003) via
# External Secrets, authenticated with GKE Workload Identity. No secret
# values live in Git or Terraform.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-reader
  namespace: cloudanzen-staging
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    iam.gke.io/gcp-service-account: eso-staging@cloudanzen-staging.iam.gserviceaccount.com
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-secret-manager
  namespace: cloudanzen-staging
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  provider:
    gcpsm:
      projectID: cloudanzen-staging
      auth:
        workloadIdentity:
          clusterLocation: asia-northeast1
          clusterName: cloudanzen
          clusterProjectID: cloudanzen-gke
          serviceAccountRef:
            name: external-secrets-reader
---
# Superuser used only by the migration Job in M1 (as on the legacy stack);
# reducing migration privileges is a planned follow-up.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudanzen-db-superuser
  namespace: cloudanzen-staging
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef: { name: gcp-secret-manager, kind: SecretStore }
  target:
    name: cloudanzen-db-superuser
    template:
      type: kubernetes.io/basic-auth
      data:
        username: postgres
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: { key: db-migrate-password }
---
# Least-privilege runtime role used by the API and worker.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudanzen-db-isms-app
  namespace: cloudanzen-staging
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef: { name: gcp-secret-manager, kind: SecretStore }
  target:
    name: cloudanzen-db-isms-app
    template:
      type: kubernetes.io/basic-auth
      data:
        username: isms_app
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: { key: db-app-password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis
  namespace: cloudanzen-staging
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef: { name: gcp-secret-manager, kind: SecretStore }
  target:
    name: redis
  data:
    - secretKey: password
      remoteRef: { key: redis-password }
