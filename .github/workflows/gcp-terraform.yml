name: GCP Terraform

# Validation only. No credentials, no plan against real state and no apply:
# remote plans and reviewed applies are added once the state backend and
# executor are selected (ADR-0002).
on:
  pull_request:
    paths:
      - 'terraform/**'
      - 'gitops/**'
      - 'charts/**'
      - '.github/workflows/gcp-terraform.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'gitops/**'
      - 'charts/**'
      - '.github/workflows/gcp-terraform.yml'

permissions:
  contents: read

jobs:
  guard:
    name: Secret and ownership guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: No secret payloads in Terraform (ADR-0003)
        run: |
          set -euo pipefail
          # Secret values must never pass through Terraform state or plans.
          if grep -rnE 'resource "google_secret_manager_secret_version"|data "google_secret_manager_secret_version"|resource "random_password"|resource "google_service_account_key"' terraform/; then
            echo "::error::Secret payloads or service-account keys are not allowed in terraform/ (ADR-0003)."
            exit 1
          fi

      - name: No committed tfvars
        run: |
          set -euo pipefail
          if git ls-files 'terraform/*.tfvars' | grep -q .; then
            echo "::error::Commit only *.tfvars.example; real values are supplied to the selected executor."
            exit 1
          fi

  gitops:
    name: GitOps manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse every manifest
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in sorted(glob.glob('gitops/**/*.yaml', recursive=True)):
              if f.endswith('/values.yaml'):
                  continue  # Helm values, checked by the chart job
              try:
                  docs = [d for d in yaml.safe_load_all(open(f)) if d]
                  for d in docs:
                      assert d.get('apiVersion') and d.get('kind') and d.get('metadata', {}).get('name'), 'missing apiVersion/kind/name'
                  print(f"ok  {f}: {len(docs)} document(s)")
              except Exception as e:
                  bad += 1
                  print(f"BAD {f}: {e}")
          sys.exit(1 if bad else 0)
          PY

  chart:
    name: Application chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint and render with each environment's values
        run: |
          set -euo pipefail
          helm version --short
          for values in gitops/apps/*/app/values.yaml; do
            env_name=$(basename "$(dirname "$(dirname "$values")")")
            echo "== $env_name"
            helm lint charts/cloudanzen -f "$values"
            helm template cloudanzen charts/cloudanzen -n "cloudanzen-$env_name" -f "$values" > "/tmp/rendered-$env_name.yaml"
          done

      - name: Argo CD hooks only (no Helm hooks)
        run: |
          set -euo pipefail
          # Argo ignores every Helm hook once an Application has any Argo hook,
          # which would make migration ordering ambiguous (plan, section 5).
          if grep -n 'helm.sh/hook' /tmp/rendered-*.yaml charts/cloudanzen/templates/*; then
            echo "::error::Use argocd.argoproj.io/hook annotations, not helm.sh/hook."
            exit 1
          fi

      - name: Images pinned by digest
        run: |
          set -euo pipefail
          if grep -nE '^\s+image: ' /tmp/rendered-*.yaml | grep -v '@sha256:'; then
            echo "::error::Every image must be pinned by digest."
            exit 1
          fi

  validate:
    name: Validate (${{ matrix.root }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - terraform/envs/org/projects
          - terraform/envs/platform/foundation
          - terraform/envs/platform/bootstrap
          - terraform/envs/staging/foundation
          - terraform/envs/prod/foundation
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive ${{ github.workspace }}/terraform

      - name: Init (no backend, locked providers)
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate
        run: terraform validate -no-color
